[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codexapter"
version = "0.2.0rc1"
description = "Configuration-driven multi-provider launcher for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The local gateway is part of every install (direct mode stays available).
dependencies = ["protoverta==0.3.0rc1"]
authors = [{ name = "HaianCao", email = "caohaian2005@gmail.com" }]
keywords = ["codex", "codex-cli", "llm", "openai", "launcher", "openrouter", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/HaianCao/CodexApter"
Documentation = "https://github.com/HaianCao/CodexApter#readme"
Repository = "https://github.com/HaianCao/CodexApter"
Issues = "https://github.com/HaianCao/CodexApter/issues"
Changelog = "https://github.com/HaianCao/CodexApter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Kept so older install commands that request the extra keep working.
gateway = []

[project.scripts]
codex-ca = "codex_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"src/codex_adapter/web_template.html" = "codex_adapter/web_template.html"
"assets/CodexApter_white.png" = "codex_adapter/assets/CodexApter_white.png"
"assets/CodexApter_black.png" = "codex_adapter/assets/CodexApter_black.png"
"assets/CodexApter_white_icon.png" = "codex_adapter/assets/CodexApter_white_icon.png"
"assets/CodexApter_black_icon.png" = "codex_adapter/assets/CodexApter_black_icon.png"

[tool.hatch.build.targets.sdist]
include = ["/src", "/assets", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.ruff]
# Formatter width; long literals that cannot wrap are left as written.
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
