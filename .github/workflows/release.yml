name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify versions and the pinned gateway hash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          installer = open("scripts/install.ps1", encoding="utf-8").read()
          init = open("src/codexapter/__init__.py", encoding="utf-8").read()
          version = project["version"]
          assert os.environ["RELEASE_TAG"] == "v" + version, "tag must match pyproject.toml version"
          assert f'__version__ = "{version}"' in init, "__version__ must match"
          assert re.search(r"\$adapterVersion = '([^']+)'", installer).group(1) == version, "installer version must match"
          assert re.fullmatch(r"[0-9a-f]{64}", re.search(r"\$protovertaSha256 = '([^']+)'", installer).group(1)), "pin the Protoverta wheel SHA-256 before releasing"
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl, dist/*.tar.gz
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  pypi:
    # Trusted Publishing: configure a PyPI publisher for this repository,
    # workflow "release.yml" and environment "pypi", then set the repository
    # variable PYPI_PUBLISH to "true".
    needs: publish
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
