name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    strategy:
      fail-fast: false
      matrix:
        gateway: [false, true]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]" ruff==0.17.2
      - name: Install the pinned gateway wheel
        if: matrix.gateway
        run: python -m pip install https://github.com/HaianCao/Protoverta/releases/download/v0.3.0a7/protoverta-0.3.0a7-py3-none-any.whl
      - name: Verify direct-only dependency boundary
        if: ${{ !matrix.gateway }}
        run: python -c "import importlib.util; assert importlib.util.find_spec('protoverta') is None"
      - name: Run Python tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Gateway tests must not skip or use an obsolete runtime
        if: matrix.gateway
        run: |
          python -c "from protoverta.server import GatewayConfig; import dataclasses; assert {'retry_attempts','shared_admission_db','client_tool_search','provider_profiles'} <= {f.name for f in dataclasses.fields(GatewayConfig)}"
          if ($LASTEXITCODE) { throw 'Incompatible gateway runtime' }
          python -c "import xml.etree.ElementTree as E; skipped=[t.attrib for t in E.parse('test-results.xml').iter('testcase') if t.find('skipped') is not None and any(n in t.get('classname','') for n in ('test_gateway_limits','test_gateway_runtime','test_auth_mode'))]; assert not skipped, skipped"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Build wheel and verify bundled frontend assets
        shell: pwsh
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(wheel).namelist()); expected={'codex_adapter/web_template.html','codex_adapter/assets/CodexApter_white.png','codex_adapter/assets/CodexApter_black.png','codex_adapter/assets/CodexApter_white_icon.png','codex_adapter/assets/CodexApter_black_icon.png'}; missing=expected-names; assert not missing, f'Missing package files: {missing}'"
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('scripts/install.ps1', 'scripts/uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $files = @('scripts/install.ps1', 'scripts/uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Smoke-test Windows install and uninstall
        shell: pwsh
        run: |
          & .\scripts\install.ps1 -SkipCodexInstall -NonInteractive
          $launcher = Join-Path $env:LOCALAPPDATA 'Programs\codex-ca\venv\Scripts\codex-ca.exe'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'codex-ca.exe was not installed' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw 'codex-ca --help failed' }
          & .\scripts\install.ps1 -SkipCodexInstall -NonInteractive -WithGateway
          $python = Join-Path (Split-Path -Parent $launcher) 'python.exe'
          & $python -c "import importlib.metadata; assert importlib.metadata.version('protoverta') == '0.3.0a7'"
          if ($LASTEXITCODE -ne 0) { throw 'Released gateway component was not installed' }
          & .\scripts\install.ps1 -SkipCodexInstall -NonInteractive
          & $python -c "import protoverta.server"
          if ($LASTEXITCODE -ne 0) { throw 'Updating dropped the gateway component' }
          & .\scripts\uninstall.ps1 -NonInteractive
          if (Test-Path -LiteralPath $launcher) { throw 'codex-ca.exe was not removed' }
