name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  test-windows:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The core comes from its GitHub release first, so the exact pin resolves without PyPI.
      - name: Install the pinned Protoverta wheel
        run: python -m pip install https://github.com/HaianCao/Protoverta/releases/download/v0.4.0/protoverta-0.4.0-py3-none-any.whl
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Gateway tests must not skip or use an obsolete runtime
        run: |
          python -c "from protoverta.server import GatewayConfig; import dataclasses; assert {'retry_attempts','shared_admission_db','client_tool_search','provider_profiles'} <= {f.name for f in dataclasses.fields(GatewayConfig)}"
          if ($LASTEXITCODE) { throw 'Incompatible gateway runtime' }
          python scripts/check_test_report.py test-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: codex-tests-${{ matrix.python-version }}
          path: test-results.xml
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy
      - name: Formatting
        run: python -m ruff format --check src tests scripts
      - name: Build wheel and verify bundled frontend assets
        shell: pwsh
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          if ($LASTEXITCODE) { throw 'Wheel build failed' }
          python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(wheel).namelist()); expected={'codexapter/web_template.html','codexapter/assets/CodexApter_white.png','codexapter/assets/CodexApter_black.png','codexapter/assets/CodexApter_white_icon.png','codexapter/assets/CodexApter_black_icon.png'}; missing=expected-names; assert not missing, f'Missing package files: {missing}'"
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('scripts/install.ps1', 'scripts/install-environment.ps1', 'scripts/uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $files = @('scripts/install.ps1', 'scripts/install-environment.ps1', 'scripts/uninstall.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Smoke-test Windows install, update and uninstall
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP 'protoverta-wheel'
          python -m pip download --no-deps --dest $wheelDir https://github.com/HaianCao/Protoverta/releases/download/v0.4.0/protoverta-0.4.0-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Protoverta wheel' }
          $wheel = (Get-ChildItem -LiteralPath $wheelDir -Filter 'protoverta-*.whl' | Select-Object -First 1).FullName
          & .\scripts\install.ps1 -SkipCodexInstall -NonInteractive -ProtovertaWheel $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Initial installation failed' }
          . .\scripts\install-environment.ps1
          $root = Join-Path $env:LOCALAPPDATA 'Programs\codex-ca'
          $launcher = Join-Path $root 'bin\codex-ca.exe'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'codex-ca launcher was not installed' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw 'codex-ca --help failed' }
          $python = Get-AdapterInstalledPython $root
          & $python -c "import importlib.metadata, protoverta.server; assert importlib.metadata.version('protoverta') == '0.4.0'"
          if ($LASTEXITCODE -ne 0) { throw 'The pinned gateway component was not installed' }
          # Older install commands pass -WithGateway; it is accepted and changes nothing.
          & .\scripts\install.ps1 -SkipCodexInstall -NonInteractive -WithGateway -ProtovertaWheel $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Update with the legacy -WithGateway flag failed' }
          $python = Get-AdapterInstalledPython $root
          & $python -c "import protoverta.server"
          if ($LASTEXITCODE -ne 0) { throw 'Updating dropped the gateway component' }
          & .\scripts\uninstall.ps1 -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
          if (Test-Path -LiteralPath $launcher) { throw 'codex-ca launcher was not removed' }
